<!doctype html>
<html lang="id">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      font: 14px system-ui;
      color: #e7eaf0;
      background: transparent;
    }
    main {
      display: grid;
      gap: 8px;
      padding: 4px 0;
    }
    #help {
      color: #95a6ba;
    }
    svg {
      width: 100%;
      display: block;
      touch-action: none;
      user-select: none;
      border-radius: 8px;
      background: #19212c;
    }
    [data-handle] {
      cursor: grab;
    }
    .dragging, .dragging [data-handle] {
      cursor: grabbing;
    }
    #line-hit {
      pointer-events: stroke;
    }
    text {
      pointer-events: none;
      paint-order: stroke;
      stroke: #111;
      stroke-width: 3px;
      fill: white;
      font-weight: 700;
    }
  </style>
  <main id="editor">
    <div id="help"></div>
    <svg id="stage" viewBox="0 0 1000 600" role="group" aria-label="Editor garis hitung dan area jalan">
      <image id="photo" x="0" y="0" width="1000" preserveAspectRatio="none" />
      <rect id="area" data-handle="area" fill="#168cff22" stroke="#55baff" stroke-width="3" />
      <line id="line" stroke="#ffd550" stroke-width="4" pointer-events="none" />
      <line id="line-hit" data-handle="line" stroke="transparent" stroke-width="22" />
      <g id="handles"></g>
      <text id="side-a" font-size="24">A</text>
      <text id="side-b" font-size="24">B</text>
    </svg>
  </main>
  <script>
    const width = 1000;
    const stage = document.getElementById("stage");
    const photo = document.getElementById("photo");
    const area = document.getElementById("area");
    const line = document.getElementById("line");
    const lineHit = document.getElementById("line-hit");
    const help = document.getElementById("help");
    const editor = document.getElementById("editor");
    const sideA = document.getElementById("side-a");
    const sideB = document.getElementById("side-b");
    let args, state, drag, pendingEdit, paintFrame, frameHeight;
    let height = 600;

    const send = (type, extra = {}) =>
      window.parent.postMessage({ isStreamlitMessage: true, type, ...extra }, "*");
    const clamp = (value, min = 0, max = 1) => Math.max(min, Math.min(max, value));
    const geometry = ({ p1, p2, roi }) => ({ p1: [...p1], p2: [...p2], roi: [...roi] });
    const attributes = (node, values) => {
      for (const [name, value] of Object.entries(values)) node.setAttribute(name, value);
    };
    const pointsEqual = (a, b) => a.every((value, i) => value === b[i]);
    const unchanged = (a, b) =>
      pointsEqual(a.p1, b.p1) && pointsEqual(a.p2, b.p2) && pointsEqual(a.roi, b.roi);
    const editable = (handle) =>
      handle.startsWith("roi") || handle === "area" ? args.edit_roi : args.edit_line;
    const pointAt = (points, id) => {
      if (id === "roi1") return points.roi.slice(0, 2);
      if (id === "roi2") return points.roi.slice(2);
      return points[id];
    };

    function createHandle(id, label) {
      const ns = "http://www.w3.org/2000/svg";
      const group = document.createElementNS(ns, "g");
      const circle = document.createElementNS(ns, "circle");
      const text = document.createElementNS(ns, "text");
      circle.dataset.handle = id;
      attributes(circle, {
        r: 16,
        fill: id.startsWith("roi") ? "#55baff" : "#ffd550",
        stroke: "#17202a",
        "stroke-width": 3,
        tabindex: 0,
        role: "slider",
        "aria-valuemin": 0,
        "aria-valuemax": 1,
        "aria-label": label,
      });
      text.setAttribute("font-size", 23);
      text.textContent = label;
      group.append(circle, text);
      const steps = {
        ArrowLeft: [-0.01, 0], ArrowRight: [0.01, 0],
        ArrowUp: [0, -0.01], ArrowDown: [0, 0.01],
      };
      circle.addEventListener("keydown", (event) => {
        const step = steps[event.key];
        if (!step || drag || !editable(id)) return;
        event.preventDefault();
        const before = geometry(state);
        move(id, before, step);
        if (!unchanged(before, state)) publish();
      });
      return { id, group, circle, text };
    }

    const handles = [
      createHandle("roi1", "Area 1"), createHandle("roi2", "Area 2"),
      createHandle("p1", "P1"), createHandle("p2", "P2"),
    ];
    document.getElementById("handles").append(...handles.map(({ group }) => group));

    function resize() {
      if (!stage.getBoundingClientRect().width) return;
      const next = Math.ceil(editor.getBoundingClientRect().height);
      if (next === frameHeight) return;
      frameHeight = next;
      send("streamlit:setFrameHeight", { height: next });
    }

    function draw() {
      const [ax, ay] = [state.p1[0] * width, state.p1[1] * height];
      const [bx, by] = [state.p2[0] * width, state.p2[1] * height];
      const [x1, y1, x2, y2] = state.roi;
      const segment = { x1: ax, y1: ay, x2: bx, y2: by };
      attributes(line, segment);
      attributes(lineHit, segment);
      lineHit.style.display = args.edit_line ? "" : "none";
      attributes(area, {
        x: x1 * width, y: y1 * height,
        width: (x2 - x1) * width, height: (y2 - y1) * height,
      });
      area.style.display = args.show_roi ? "" : "none";
      area.style.pointerEvents = args.edit_roi ? "" : "none";
      for (const { id, group, circle, text } of handles) {
        group.style.display = editable(id) ? "" : "none";
        const [x, y] = pointAt(state, id);
        attributes(circle, {
          cx: x * width,
          cy: y * height,
          "aria-valuenow": x,
          "aria-valuetext": `X ${x.toFixed(2)} Y ${y.toFixed(2)}`,
        });
        attributes(text, { x: clamp(x * width + 20, 8, 915), y: Math.max(26, y * height - 20) });
      }
      const dx = bx - ax, dy = by - ay;
      const length = Math.hypot(dx, dy) || 1;
      for (const [label, sign] of [[sideA, -1], [sideB, 1]]) {
        attributes(label, {
          x: clamp((ax + bx) / 2 - (sign * 30 * dy) / length, 12, 975),
          y: clamp((ay + by) / 2 + (sign * 30 * dx) / length, 26, height - 8),
        });
      }
    }

    function schedulePaint() {
      if (paintFrame !== undefined) return;
      paintFrame = requestAnimationFrame(() => {
        paintFrame = undefined;
        draw();
      });
    }

    function translate(a, b, delta) {
      const offset = delta.map((value, i) =>
        clamp(value, -Math.min(a[i], b[i]), 1 - Math.max(a[i], b[i])),
      );
      return [a, b].map((point) => point.map((value, i) => clamp(value + offset[i])));
    }

    function move(id, before, delta) {
      if (id === "line") {
        [state.p1, state.p2] = translate(before.p1, before.p2, delta);
      } else if (id === "area") {
        state.roi = translate(before.roi.slice(0, 2), before.roi.slice(2), delta).flat();
      } else {
        const point = pointAt(before, id).map((value, i) => clamp(value + delta[i]));
        const [x1, y1, x2, y2] = before.roi;
        const minWidth = Math.min(0.01, x2 - x1);
        const minHeight = Math.min(0.01, y2 - y1);
        if (id === "roi1") {
          state.roi = [clamp(point[0], 0, x2 - minWidth), clamp(point[1], 0, y2 - minHeight), x2, y2];
        } else if (id === "roi2") {
          state.roi = [x1, y1, clamp(point[0], x1 + minWidth, 1), clamp(point[1], y1 + minHeight, 1)];
        } else if (!pointsEqual(point, before[id === "p1" ? "p2" : "p1"])) {
          state[id] = point;
        }
      }
      schedulePaint();
    }

    function publish() {
      pendingEdit = crypto.randomUUID();
      send("streamlit:setComponentValue", {
        value: { ...geometry(state), edit_id: pendingEdit },
        dataType: "json",
      });
    }

    function pointerPoint(event) {
      const transformed = new DOMPoint(event.clientX, event.clientY)
        .matrixTransform(stage.getScreenCTM().inverse());
      return [transformed.x / width, transformed.y / height];
    }

    stage.addEventListener("pointerdown", (event) => {
      const handle = event.target.dataset.handle;
      if (drag || !event.isPrimary || event.button !== 0 || !handle || !editable(handle)) return;
      event.preventDefault();
      drag = {
        handle, pointerId: event.pointerId, start: pointerPoint(event),
        clientX: event.clientX, clientY: event.clientY, before: geometry(state), moved: false,
      };
      stage.setPointerCapture(event.pointerId);
      stage.classList.add("dragging");
    });

    function movePointer(event) {
      if (!drag || drag.pointerId !== event.pointerId) return;
      const distance = Math.hypot(event.clientX - drag.clientX, event.clientY - drag.clientY);
      if (!drag.moved && distance < 2) return;
      drag.moved = true;
      const delta = pointerPoint(event).map((value, i) => value - drag.start[i]);
      move(drag.handle, drag.before, delta);
    }

    stage.addEventListener("pointermove", movePointer);
    stage.addEventListener("pointerup", (event) => {
      if (!drag || event.pointerId !== drag.pointerId) return;
      movePointer(event);
      const before = drag.before;
      drag = undefined;
      stage.classList.remove("dragging");
      if (!unchanged(before, state)) publish();
    });

    function cancelDrag(event) {
      if (!drag || event.pointerId !== drag.pointerId) return;
      state = drag.before;
      drag = undefined;
      stage.classList.remove("dragging");
      schedulePaint();
    }
    stage.addEventListener("pointercancel", cancelDrag);
    stage.addEventListener("lostpointercapture", cancelDrag);

    window.addEventListener("message", (event) => {
      if (event.source !== window.parent || event.data?.type !== "streamlit:render") return;
      const previous = args;
      args = event.data.args;
      if (pendingEdit && args.saved_edit_id === pendingEdit) pendingEdit = undefined;
      // A server render can still carry coordinates from before the current gesture.
      if (!drag && !pendingEdit) state = geometry(args);
      if (args.image !== previous?.image) {
        height = args.image_height;
        stage.setAttribute("viewBox", `0 0 ${width} ${height}`);
        photo.setAttribute("height", height);
        photo.setAttribute("href", args.image);
      }
      if (args.edit_line !== previous?.edit_line || args.edit_roi !== previous?.edit_roi) {
        const tips = [];
        if (args.edit_line) tips.push("Geser garis atau titik kuning P1/P2.");
        if (args.edit_roi) tips.push("Geser kotak biru atau tarik sudutnya untuk mengubah ukuran.");
        help.textContent = tips.join(" ");
      }
      schedulePaint();
    });
    new ResizeObserver(resize).observe(editor);
    send("streamlit:componentReady", { apiVersion: 1 });
  </script>
</html>
