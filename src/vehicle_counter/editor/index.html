<!doctype html>
<html lang="id">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />
  <style>
    body {
      margin: 0;
      font: 14px system-ui;
      color: #e7eaf0;
      background: transparent;
    }
    .help {
      margin: 6px 0 10px;
      color: #8290a4;
    }
    svg {
      width: 100%;
      display: block;
      touch-action: none;
      user-select: none;
      border-radius: 8px;
      background: #19212c;
    }
    .handle {
      cursor: grab;
    }
    .handle:active {
      cursor: grabbing;
    }
    text {
      pointer-events: none;
      paint-order: stroke;
      stroke: #111;
      stroke-width: 3px;
      fill: white;
      font-weight: 700;
    }
  </style>
  <div class="help" id="help">Geser titik P1 dan P2 pada gambar.</div>
  <svg
    id="stage"
    viewBox="0 0 1000 600"
    role="group"
    aria-label="Editor garis hitung dan area jalan"
  >
    <image
      id="photo"
      x="0"
      y="0"
      width="1000"
      height="600"
      preserveAspectRatio="none"
    />
    <rect id="area" fill="#168cff22" stroke="#55baff" stroke-width="3" />
    <line id="line" stroke="#ffd550" stroke-width="4" />
    <g id="handles"></g>
  </svg>
  <script>
    const stage = document.getElementById("stage"),
      photo = document.getElementById("photo");
    let state = null,
      args = null,
      drag = null,
      height = 600;
    const send = (type, extra = {}) =>
      window.parent.postMessage(
        { isStreamlitMessage: true, type, ...extra },
        "*",
      );
    const clamp = (n) => Math.max(0, Math.min(1, n));
    function dimensions() {
      send("streamlit:setFrameHeight", {
        height: Math.ceil(stage.getBoundingClientRect().height + 48),
      });
    }
    function draw() {
      const point = (p) => [p[0] * 1000, p[1] * height];
      const a = point(state.p1),
        b = point(state.p2),
        r = state.roi;
      const line = document.getElementById("line");
      ["x1", "y1", "x2", "y2"].forEach((k, i) =>
        line.setAttribute(k, [...a, ...b][i]),
      );
      const area = document.getElementById("area");
      area.setAttribute("x", r[0] * 1000);
      area.setAttribute("y", r[1] * height);
      area.setAttribute("width", (r[2] - r[0]) * 1000);
      area.setAttribute("height", (r[3] - r[1]) * height);
      area.style.display = args.show_roi ? "" : "none";
      const handles = document.getElementById("handles");
      handles.replaceChildren();
      const choices = args.edit_line
        ? [
            ["p1", state.p1, "P1"],
            ["p2", state.p2, "P2"],
          ]
        : [];
      if (args.edit_roi)
        choices.push(
          ["roi1", r.slice(0, 2), "Area 1"],
          ["roi2", r.slice(2), "Area 2"],
        );
      for (const [id, p, label] of choices) {
        const [x, y] = point(p),
          circle = document.createElementNS(
            "http://www.w3.org/2000/svg",
            "circle",
          );
        circle.setAttribute("cx", x);
        circle.setAttribute("cy", y);
        circle.setAttribute("r", 14);
        circle.setAttribute(
          "fill",
          id.startsWith("roi") ? "#55baff" : "#ffd550",
        );
        circle.setAttribute("stroke", "#17202a");
        circle.setAttribute("stroke-width", 3);
        circle.dataset.handle = id;
        circle.classList.add("handle");
        circle.setAttribute("tabindex", "0");
        circle.setAttribute("role", "slider");
        circle.setAttribute("aria-valuemin", "0");
        circle.setAttribute("aria-valuemax", "1");
        circle.setAttribute("aria-valuenow", p[0]);
        circle.setAttribute(
          "aria-valuetext",
          `X ${p[0].toFixed(2)} Y ${p[1].toFixed(2)}`,
        );
        circle.setAttribute(
          "aria-label",
          label + " X " + p[0].toFixed(2) + " Y " + p[1].toFixed(2),
        );
        circle.addEventListener("keydown", (event) => {
          const delta = {
            ArrowLeft: [-0.01, 0],
            ArrowRight: [0.01, 0],
            ArrowUp: [0, -0.01],
            ArrowDown: [0, 0.01],
          }[event.key];
          if (delta) {
            event.preventDefault();
            move(id, [clamp(p[0] + delta[0]), clamp(p[1] + delta[1])]);
            handles.querySelector(`[data-handle="${id}"]`).focus();
            publish();
          }
        });
        handles.append(circle);
        const text = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text",
        );
        text.setAttribute("x", Math.max(8, Math.min(915, x + 18)));
        text.setAttribute("y", Math.max(26, y - 20));
        text.setAttribute("font-size", 23);
        text.textContent = label;
        handles.append(text);
      }
      const dx = b[0] - a[0],
        dy = b[1] - a[1];
      const length = Math.hypot(dx, dy) || 1;
      for (const [sign, label] of [
        [-1, "A"],
        [1, "B"],
      ]) {
        const text = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "text",
        );
        text.setAttribute(
          "x",
          Math.max(
            12,
            Math.min(975, (a[0] + b[0]) / 2 - (sign * 30 * dy) / length),
          ),
        );
        text.setAttribute(
          "y",
          Math.max(
            26,
            Math.min(height - 8, (a[1] + b[1]) / 2 + (sign * 30 * dx) / length),
          ),
        );
        text.setAttribute("font-size", 24);
        text.textContent = label;
        handles.append(text);
      }
    }
    function move(id, p) {
      if (id === "p1" || id === "p2") state[id] = p;
      if (id === "roi1") {
        state.roi[0] = Math.min(p[0], state.roi[2] - 0.01);
        state.roi[1] = Math.min(p[1], state.roi[3] - 0.01);
      }
      if (id === "roi2") {
        state.roi[2] = Math.max(p[0], state.roi[0] + 0.01);
        state.roi[3] = Math.max(p[1], state.roi[1] + 0.01);
      }
      draw();
    }
    function publish() {
      send("streamlit:setComponentValue", {
        value: { ...state, edit_id: crypto.randomUUID() },
        dataType: "json",
      });
    }
    stage.addEventListener("pointerdown", (event) => {
      drag = event.target.dataset.handle;
      if (drag) {
        event.preventDefault();
        stage.setPointerCapture(event.pointerId);
      }
    });
    stage.addEventListener("pointermove", (event) => {
      if (!drag) return;
      const rect = stage.getBoundingClientRect();
      move(drag, [
        clamp((event.clientX - rect.left) / rect.width),
        clamp((event.clientY - rect.top) / rect.height),
      ]);
    });
    stage.addEventListener("pointerup", () => {
      if (drag) {
        drag = null;
        publish();
      }
    });
    stage.addEventListener("pointercancel", () => {
      drag = null;
    });
    window.addEventListener("message", (event) => {
      if (
        event.source !== window.parent ||
        event.data.type !== "streamlit:render"
      )
        return;
      args = event.data.args;
      state = { p1: [...args.p1], p2: [...args.p2], roi: [...args.roi] };
      document.getElementById("help").textContent = args.edit_roi
        ? args.edit_line
          ? "Geser P1/P2 untuk garis. Geser dua titik biru untuk area satu lajur."
          : "Garis profil dikunci. Geser dua titik biru untuk area satu lajur."
        : args.edit_line
          ? "Geser P1 dan P2 untuk memindahkan garis hitung."
          : "Garis profil dikunci. Area mengikuti pengaturan angka.";
      photo.onload = dimensions;
      const probe = new Image();
      probe.onload = () => {
        height = (1000 * probe.height) / probe.width;
        stage.setAttribute("viewBox", `0 0 1000 ${height}`);
        photo.setAttribute("height", height);
        photo.setAttribute("href", args.image);
        draw();
        dimensions();
      };
      probe.src = args.image;
    });
    new ResizeObserver(dimensions).observe(stage);
    send("streamlit:componentReady", { apiVersion: 1 });
  </script>
</html>
