[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-counter"
version = "0.1.0"
description = "Vehicle crossing counter for a digital image processing course project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
vision = ["opencv-python>=4.8,<5"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
vehicle-counter-simulate = "vehicle_counter.simulation:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
